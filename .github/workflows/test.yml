name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run engine tests
        # 直接跑测试文件：node --test 会 spawn 带管道的子进程，在受限环境里会 EPERM
        run: node test/engine.test.mjs
